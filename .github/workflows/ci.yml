name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import every module
        run: python -c "import reelforge.server, reelforge.jobs, reelforge.compose, reelforge.render, reelforge.ai, reelforge.ingest; print('ok')"
      - name: Compose a page (no browser needed)
        run: python packaging/ci_smoke.py

  build:
    runs-on: windows-latest
    needs: smoke
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build the exe
        run: pyinstaller --clean --noconfirm packaging/reelforge.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Reelforge-windows
          path: dist/Reelforge.exe
